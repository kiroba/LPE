name: lpe
description: "LPE — Live Persona Engine app for The Omniverse. Create your Halo; your identity home."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  omni_core_ui:
    git:
      url: https://github.com/kiroba/Omni-Core-UI.git
      ref: v0.1.3
  cryptography: ^2.7.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
