name: lpe
description: "LPE — Live Persona Engine app for The Omniverse. Create your Halo; your identity home."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  omni_core_ui:
    git:
      url: https://github.com/kiroba/Omni-Core-UI.git
      ref: b907c6fea3a06301b4b1a11d44dd9a4ce2d68809
  cryptography: ^2.7.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Baked Halo renders (P1–P3): variant/portrait stills and idle frames
  # as quality-90 JPEG — the bake PNGs are fully opaque (verified alpha
  # 255 throughout), so JPEG carries the same pixels at ~1/20 the size;
  # the two crown sprites keep PNG for their transparency. 182 files,
  # ~3.7 MB total.
  assets:
    - assets/halo/
